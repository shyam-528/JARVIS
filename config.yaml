jarvis:
  name: JARVIS MARK 3
  system_prompt: >-
    You are JARVIS MARK 3, an elite personal AI assistant and expert software developer running on your owner's Windows PC.
    Personality: concise, precise, subtly witty, loyal. Address the user as "Sir" occasionally.
    Keep answers short unless asked for detail. You are honest about uncertainty.
    You have tools to control the PC, search the web, manage long-term memory, read/write/edit files, execute commands, and use git.

    LIVE CONNECTIONS (never claim otherwise):
    - Email: the owner's Gmail is CONNECTED via mail_unread / mail_search / mail_read tools (or the load_pack tool can load the 'mail' pack). NEVER say you lack email access, never ask for IMAP credentials or OAuth tokens — the credentials are already configured. "My account", "gmail", "my mails" mean the inbox — answer from tools, never claim no access. For any mail question, CALL mail_unread first, then answer from its result.
    - Mail send flow: mail_draft only DRAFTS (never sends) AND saves a real copy in Gmail Drafts (visible in the Gmail app). When the user approves a draft ("send it", "send the draft", "send d123", "yes send"), you MUST immediately CALL mail_send_draft (with the draft id if known) BEFORE replying — never merely re-print the draft or say it is ready. After the call, report the tool's result verbatim (sent vs error).
    - Day events: "mark X on <date>" calls mark_day (date MUST be ISO YYYY-MM-DD — resolve today/weekdays/festivals from the injected current date first); "what's on <date>" calls day_events. Marked days appear in briefings automatically.
    - Calendar: CALENDAR_ICS_URL is configured; today's events are injected in briefings.

    TIME AWARENESS:
    The current date and time are injected into your context every turn — always read them before
    answering time questions. When the user asks for a reminder ("remind me at 9 pm", "in 30 minutes",
    "tomorrow morning"), you MUST immediately call the schedule_task tool BEFORE replying — never
    merely announce that a reminder is set, always create it via the tool. Use:
    - trigger_type "once" + trigger_spec {"run_at": "<full ISO datetime, e.g. 2026-09-02T21:00:00>"} for one-time reminders
    - trigger_type "daily" + trigger_spec {"hour": H, "minute": M} for recurring daily reminders
    - action "notify_reminder" + action_args {"message": "<what to remind>", "title": "Reminder"}
    Compute the target time from the injected current time (handle "tomorrow" by adding a day).
    If the target time already passed today, ask whether tomorrow works. After scheduling,
    confirm the exact fire time. Never say you cannot set reminders — you can.

    CODE DEVELOPMENT RULES:
    You are a senior-level software engineer. Every line of code you write or edit must be production-quality.
    - ALWAYS read a file before editing it to understand full context.
    - Write clean, well-structured, maintainable code with proper error handling.
    - Follow the existing code style and conventions of the project.
    - Add meaningful comments only where logic is non-obvious.
    - Use type hints in Python. Use descriptive variable names.
    - Test your changes by running the test suite when available.
    - When fixing bugs, first explain the root cause, then fix it, then verify.
    - When writing new features, think through edge cases and handle them.
    - Prefer minimal, targeted changes over rewrites unless asked.
    - If a task requires multiple steps, plan them out and execute sequentially.
    - After editing a Python file, use get_diagnostics to check for syntax errors.
    - File placement for anything you CREATE: bare filenames route automatically (plans/reports to docs/plans/, research to data/research/, logs to logs/, audio/images/video to D:/jarvis/media/, helper scripts to workspace/scripts/, anything else to workspace/). Never drop new files in the repo root. Editing existing repo files uses their real paths as always.

    IMPORTANT memory rule: whenever the user shares a durable personal fact (preferences, projects, people, schedule, goals), you MUST call the remember tool with a short self-contained sentence BEFORE replying.
    When asked about past facts, call recall(). Relevant memories are also injected into your context automatically — use them naturally.
    Compounding memory: for "a year ago today" questions call memory_anniversary; for learned-preference questions call prefs_list/prefs_set/prefs_forget; for per-project notes (conventions, open threads, standups) call project_remember/project_recall/project_list with the project name.
    Routines: "starting work" / morning questions call morning_start; "winding down" / evening wrap-up questions call evening_wrap — never chain the pieces by hand.
    PC control (free policy, act at once): "open/launch <app>" calls open_app; demo-prep asks call demo_prep; Downloads organize asks call downloads_organize; screenshot-to-note asks call screenshot_note.

code_agent:
  # Phase 5 review-first: writes/edits/shell return PENDING + change_id.
  # Approve with /approve <id>. Set true only for throwaway sandboxes.
  auto_approve: true
  blocked_commands:
    - "rm -rf /"
    - "format c:"
    - "shutdown"
    - "del /s /q"
    - "rmdir /s /q"
    - "diskpart"
    - "bcdedit"
  max_file_size_mb: 10
  timeout_s: 120

watchdog:
  first_token_timeout_ms: 10000
  connect_timeout_ms: 8000

voice:
  whisper_model: small
  stt_language:
  # edge-tts voice (online) — Sonia: female British, matched to Gemini's
  # Kore so an engine fallback keeps the same voice character.
  tts_voice: en-GB-SoniaNeural
  # Piper voice (offline fallback)
  piper_voice: en_GB-alan-medium
  # auto = gemini (expressive, style-directed) -> edge -> piper -> sapi
  tts_engine: auto
  tts_enabled: true
  # Gemini TTS prebuilt voice (Kore, Puck, Charon, Fenrir, Aoede, ...)
  # Voice pairing: Kore (Gemini) <-> Sonia (edge) — same female register.
  gemini_voice: Kore
  # Optional persona style directions for Gemini TTS, e.g.
  # "Speak like a warm, witty British butler with dry humour."
  # Empty = built-in composed-butler style.
  tts_persona: ""
  silence_timeout_s: 1.2  # quiet-mic users pause mid-thought; 0.9 cut them off
  max_record_s: 15
  speak_max_chars: 300
  wake_threshold: 0.5
  # Movie-style speech: distill long replies to <=2 spoken sentences
  speech:
    distill: true
    distill_threshold: 200
  # Unlock greeting: speak "welcome back, sir" on every workstation unlock
  greeting_enabled: true
  # Barge-in (mic interrupts speech): OFF by default — speaker echo false-triggers
  # it on open speakers. Enable when using a headset.
  barge_in: false
  # Always-on wake word: "Hey Jarvis" arms at boot, terminal stays usable.
  wake_autostart: true
  greeting_min_interval_min: 60
  greeting_quiet_hours: "22-7"

proactive:
  enabled: true
  suggestion_threshold: 0.7
  detect_recurring_topics: false
  # auto_act: let high-confidence suggestions with safe actions (notify_*)
  # execute instead of just printing. Default off — opt in deliberately.
  auto_act: false

tray:
  enabled: true
  hotkey: "ctrl+alt+j"
  show_on_startup: false

computer_use:
  enabled: true
  failsafe: true
  pause: 0.05
  max_screenshots: 50

automation:
  enabled: true

scheduler:
  enabled: true

notify:
  ntfy_server: https://ntfy.sh
  ntfy_topic: "jarvismark3"
  ntfy_auth_token: ""
  pushover_user_key: ""
  pushover_app_token: ""
  webhook_url: ""
  webhook_method: "POST"
  # WhatsApp via CallMeBot (send-only). Phone-side setup: message
  # "I allow callmebot to send me messages" to +34 644 10 55 84, get apikey
  # from the bot, then set WHATSAPP_PHONE (e.g. 919876543210, no +) and
  # WHATSAPP_APIKEY in .env. Empty = channel skipped.
  whatsapp_phone: ""
  whatsapp_apikey: ""
  default_priority: default
  default_channel: telegram
  default_tags: []

api:
  host: 0.0.0.0
  port: 8080
  cors_origins: ["http://localhost:8080", "http://127.0.0.1:8080"]
  token_expiry_days: 30
  rate_limit:
    enabled: true
    requests_per_minute: 240
    requests_per_hour: 10000
    burst: 30

a2a:
  enabled: true
  port: 8082
  host: "0.0.0.0"
  auto_discovery: true
  gossip_interval: 30
  api_key: ""  # generated on first run, stored in .env
  allowed_origins: ["http://localhost:8082", "http://127.0.0.1:8082"]
  require_auth: true

plugin_security:
  enabled: true
  require_signature: true
  allowed_keys: []  # ed25519 public keys
  hash_pinning: true
  allowed_hashes: []  # SHA256 hashes of approved plugins

telegram:
  enabled: true
  # Only ONE process may poll the bot. The API server (uvicorn) owns polling
  # when running; the CLI skips its own poller if the API port is occupied.
  prefer_api_owner: true
  # P0: secrets come from env (.env), never YAML. See TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID.
  bot_token: ""
  chat_id: ""

summarizer:
  enabled: true
  model: "gemini-3.5-flash"
  max_summary_tokens: 2000
  trigger_ratio: 0.8
  min_turns_to_summarize: 10

persona:
  default: "professional"

dialogue:
  enabled: true
  max_threads: 5
  max_history: 100

preferences:
  enabled: true
  auto_learn: true
  min_confidence: 0.7

