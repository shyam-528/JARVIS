name: Public web app

on:
  push:
    paths:
      - 'api/public*.py'
      - 'web/public/**'
      - 'tests/test_public_web.py'
      - 'requirements.web.txt'
      - '.github/workflows/public-web.yml'
  pull_request:
    paths:
      - 'api/public*.py'
      - 'web/public/**'
      - 'tests/test_public_web.py'
      - 'requirements.web.txt'
      - '.github/workflows/public-web.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jarvis_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: jarvis_web_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.web.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.web.txt
      - run: python -m unittest tests.test_public_web -v
      - name: PostgreSQL account isolation and concurrency
        run: python -m unittest tests.test_public_web -v
        env:
          JARVIS_TEST_DATABASE_URL: postgresql://jarvis_test:local-test-only@localhost:5432/jarvis_web_test
      - run: node --check web/public/app.js
